[broker.config]
ip = 127.0.0.1
port = 1883
username = None
password = None
database_name = data/database.db
device_registry = data/device_registry.db
device_types = multisensor,stromzaehler

[multisensor.types]
humidity = REAL
pressure = REAL
temperature = REAL
pm2.5 = REAL
pm10 = REAL
date = TEXT
battery_level = REAL


[stromzaehler.types]
E_in = REAL
E_out = REAL
Power = REAL
date = TEXT


[uwsgi]
module = wsgi:app

master = true
processes = 1

socket = JeinMeteo.sock
chmod-socket = 660
vacuum = true

die-on-term = true